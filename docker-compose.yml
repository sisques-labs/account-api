version: '3.8'

services:
  # NOTE: account-api normally points at the SHARED local-dev-stack Postgres
  # (see README "Running locally") — this container is kept only as the
  # template's own fallback/dev convenience and is not used by default.
  postgres:
    image: postgres:18-alpine
    ports:
      - '5434:5432'
    environment:
      POSTGRES_DB: nestjs_template_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nestjs_template_db']
      interval: 5s
      timeout: 5s
      retries: 5

  # Keycloak (self-hosted identity provider, MVP adapter) — lives HERE, in
  # account-api's own compose file, not in local-dev-stack. Rationale (see
  # README "Keycloak — where it runs"): local-dev-stack exists to amortize
  # infra shared across MULTIPLE services (Postgres/Kafka/Redis/OTel);
  # Keycloak has exactly one consumer (account-api itself — the architecture
  # doc's one exception to "apps never talk to Keycloak directly"), so it's
  # kept as a private implementation detail of this service instead, the
  # same way the template already keeps its own otel-collector/Jaeger here
  # alongside local-dev-stack's shared Postgres.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      # 8081 collides with local-dev-stack's mongo-express default port —
      # use 8083 instead (8082 is reserved for docker-compose.test.yml's
      # keycloak-test).
      - '8083:8080' # Admin console + API — http://localhost:8083
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  # Local OpenTelemetry stack — optional, for viewing traces/metrics in dev.
  # Point the app at it with OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - '16686:16686' # UI — http://localhost:16686
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
      - '8889:8889' # Prometheus scrape endpoint for collected metrics
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:v3.13.2
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090' # UI — http://localhost:9090
    depends_on:
      - otel-collector

volumes:
  postgres_data:
